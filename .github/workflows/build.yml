# Builds the APK and the app bundle (.aab) on every push to main, publishes both as a
# GitHub Release (the APK can be installed straight from the Releases page), and uploads the
# .aab to Google Play's internal testing track, so the phone gets the update from the Play Store.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.6"

      - name: Unpack signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is missing - see README, one-time setup"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cardash.p12"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/cardash.p12" >> "$GITHUB_ENV"

      - name: Build APK and app bundle
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle assembleRelease bundleRelease --console=plain --stacktrace

      - name: Name the files
        run: |
          cp app/build/outputs/apk/release/app-release.apk "car-dash-${{ github.run_number }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "car-dash-${{ github.run_number }}.aab"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: |
            car-dash-${{ github.run_number }}.apk
            car-dash-${{ github.run_number }}.aab

      # Needs the secret PLAY_SERVICE_ACCOUNT_JSON: the key of a Google Cloud service account that
      # may only release Car Dash to testing tracks (see README, "Google Play").
      - name: Upload to Google Play (internal testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.arka01.cardash
          releaseFiles: car-dash-${{ github.run_number }}.aab
          releaseName: ${{ github.run_number }} (0.1.${{ github.run_number }})
          track: internal
          status: completed
