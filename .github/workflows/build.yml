# Builds the APK and the app bundle (.aab) on every push to main, publishes both as a
# GitHub Release (the APK can be installed straight from the Releases page), and uploads the
# .aab to Google Play's internal testing track, so the phone gets the update from the Play Store.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Third-party actions are pinned to full commit SHAs (comment = version), so a moved tag
# can never swap the code that gets our secrets. Update on purpose: new SHA + new comment.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # don't leave the GitHub token in .git/config for later steps

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.14.6"

      - name: Unpack signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is missing - see README, one-time setup"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cardash.p12"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/cardash.p12" >> "$GITHUB_ENV"

      - name: Build APK and app bundle
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle assembleRelease bundleRelease --console=plain --stacktrace

      - name: Name the files
        run: |
          cp app/build/outputs/apk/release/app-release.apk "car-dash-${{ github.run_number }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "car-dash-${{ github.run_number }}.aab"

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: |
            car-dash-${{ github.run_number }}.apk
            car-dash-${{ github.run_number }}.aab

      # Needs the secret PLAY_SERVICE_ACCOUNT_JSON: the key of a Google Cloud service account that
      # may only release Car Dash to testing tracks (see README, "Google Play").
      - name: Upload to Google Play (internal testing)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.arka01.cardash
          releaseFiles: car-dash-${{ github.run_number }}.aab
          releaseName: ${{ github.run_number }} (0.1.${{ github.run_number }})
          track: internal
          status: completed
